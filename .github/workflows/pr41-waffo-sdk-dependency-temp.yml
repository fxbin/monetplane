name: Temporary PR41 Waffo SDK Dependency

on: push

permissions:
  contents: write

jobs:
  add-sdk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p1-provider-integration-console
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Add official Waffo Node SDK
        run: npx --yes pnpm@10 add @waffo/waffo-node@3.1.0
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: add official Waffo Node SDK"
          git push origin HEAD:feat/p1-provider-integration-console
