name: Temporary Biome Autofix

on:
  push:
    branches:
      - feat/p1-billing-operations

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0

      - name: Format with repository Biome version
        run: npx --yes @biomejs/biome@2.2.2 check --write .

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No Biome changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply biome 2.2.2 formatting"
          git push
