name: Temporary PR41 Biome Autofix
on: push
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p1-provider-integration-console
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - run: npx --yes pnpm@10 install --no-frozen-lockfile
      - run: npx --yes pnpm@10 exec biome check --write src/app src/modules src/server src/components tests/integration/billing-operation-retry.test.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests/integration/billing-operation-retry.test.ts
          git diff --cached --quiet || git commit -m 'style: format safe retry slice'
          git push
