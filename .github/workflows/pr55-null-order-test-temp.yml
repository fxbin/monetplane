name: Temporary PR55 Null Order Test

on:
  push:
    branches:
      - feat/p1-billing-operations

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: monetplane
          POSTGRES_PASSWORD: monetplane
          POSTGRES_DB: monetplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monetplane -d monetplane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://monetplane:monetplane@localhost:5432/monetplane_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0

      - name: Install dependencies with pnpm
        run: npx --yes pnpm@10 install --no-frozen-lockfile

      - name: Migrate database
        run: npx --yes pnpm@10 run db:migrate

      - name: Verify null-order refund reconciliation
        run: npx --yes pnpm@10 exec vitest run tests/integration/billing-operations-null-order.test.ts --config vitest.integration.config.ts
