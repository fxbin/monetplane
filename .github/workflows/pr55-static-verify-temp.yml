name: Temporary PR55 Static Verify

on:
  push:
    branches:
      - feat/p1-billing-operations

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0

      - name: Install dependencies with pnpm
        run: npx --yes pnpm@10 install --no-frozen-lockfile

      - name: Lint
        run: npx --yes pnpm@10 run lint

      - name: Typecheck
        run: npx --yes pnpm@10 run typecheck

      - name: Build
        run: npx --yes pnpm@10 run build
