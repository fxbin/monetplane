name: Temporary PR41 Waffo SDK Shape

on: push

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Install
        run: npx --yes pnpm@10 install --no-frozen-lockfile
      - name: Print relevant Waffo SDK declarations
        run: |
          FILE=node_modules/@waffo/waffo-node/dist/index.d.ts
          echo '=== CONFIG ==='
          sed -n '1,170p' "$FILE"
          echo '=== ORDER TYPES ==='
          sed -n '200,620p' "$FILE"
          echo '=== SUBSCRIPTION TYPES ==='
          sed -n '850,1250p' "$FILE"
          echo '=== WEBHOOK ==='
          sed -n '1570,1665p' "$FILE"
          echo '=== RESOURCES ==='
          sed -n '1790,1985p' "$FILE"
          echo '=== WAFFO CLASS + ERRORS ==='
          sed -n '2320,2570p' "$FILE"
