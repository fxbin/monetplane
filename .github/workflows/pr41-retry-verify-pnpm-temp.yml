name: Temporary PR41 PNPM Verify
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - run: npx --yes pnpm@10 install --no-frozen-lockfile
      - run: npx --yes pnpm@10 run lint
      - run: npx --yes pnpm@10 run typecheck
      - run: npx --yes pnpm@10 run test
      - run: npx --yes pnpm@10 run build
