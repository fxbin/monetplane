name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: monetplane
          POSTGRES_PASSWORD: monetplane
          POSTGRES_DB: monetplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monetplane -d monetplane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://monetplane:monetplane@localhost:5432/monetplane_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migrate fresh database
        run: npm run db:migrate

      - name: Verify migration repeatability
        run: npm run db:migrate

      - name: Build
        run: npm run build

      - name: Verify database-aware health endpoint
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/monetplane-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          grep '"status":"ok"' /tmp/health.json
