name: Temporary PR41 Waffo Format

on: push

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p1-provider-integration-console
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - run: npx --yes pnpm@10 install --no-frozen-lockfile
      - name: Format with repository Biome
        run: npx --yes pnpm@10 exec biome check --write --unsafe .
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Waffo contract migration"
          git push origin HEAD:feat/p1-provider-integration-console
