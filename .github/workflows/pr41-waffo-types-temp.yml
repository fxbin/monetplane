name: Temporary PR41 Waffo Types

on: push

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - run: npx --yes pnpm@10 install --no-frozen-lockfile
      - name: Print exact request and response types
        run: |
          FILE=node_modules/@waffo/waffo-node/dist/index.d.ts
          for PATTERN in 'interface ApiResponse' 'interface CreateSubscriptionParams' 'interface InquiryMerchantConfigParams' 'interface InquiryMerchantConfigData' 'interface WebhookResult'; do
            LINE=$(grep -n "$PATTERN" "$FILE" | head -1 | cut -d: -f1)
            echo "=== $PATTERN @ $LINE ==="
            if [ -n "$LINE" ]; then START=$((LINE-5)); END=$((LINE+110)); sed -n "${START},${END}p" "$FILE"; fi
          done
